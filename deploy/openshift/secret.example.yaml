# TEMPLATE ONLY - do not commit real credentials.
# The Ansible playbook creates this Secret from the DB_PASSWORD environment
# variable. To create it by hand instead:
#
#   oc create secret generic fraud-shield-db \
#     --from-literal=POSTGRESQL_USER=fraudshield \
#     --from-literal=POSTGRESQL_PASSWORD='<choose-a-password>' \
#     --from-literal=POSTGRESQL_DATABASE=fraudshield \
#     --from-literal=DATABASE_URL='postgres://fraudshield:<url-encoded-password>@fraud-shield-postgres:5432/fraudshield?sslmode=disable'
#   oc label secret fraud-shield-db app=fraud-shield
apiVersion: v1
kind: Secret
metadata:
  name: fraud-shield-db
  labels:
    app: fraud-shield
type: Opaque
stringData:
  POSTGRESQL_USER: fraudshield
  POSTGRESQL_PASSWORD: change-me
  POSTGRESQL_DATABASE: fraudshield
  DATABASE_URL: postgres://fraudshield:change-me@fraud-shield-postgres:5432/fraudshield?sslmode=disable
