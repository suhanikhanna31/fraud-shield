# Render Blueprint: builds the repo's Dockerfile and attaches a managed
# Postgres. Deploy via Dashboard -> New -> Blueprint, pointing at this repo.
services:
  - type: web
    name: fraud-shield
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fraud-shield-db
          property: connectionString

databases:
  - name: fraud-shield-db
    plan: free
    databaseName: fraudshield
    user: fraudshield
